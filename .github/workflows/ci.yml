name: CI Quality Gate & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Code Hygiene & Formatting (Ruff)
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Strict Static Type Checking (Mypy)
        run: |
          mypy src tests

      - name: Security SAST Audit (Bandit)
        run: |
          bandit -r src/

      - name: Automated Unit & Adversarial Test Suite
        run: |
          pytest --cov=src/zero_trust --cov-report=term-missing --cov-fail-under=90
